# DISABLED 2026-09-27. TLDR has exactly one scheduler: the crontab entry running TLDRCatchup.ts at
# 09:00 weekdays (see DOCUMENTATION/TLDR/cron-config.md). This job ran the scraper at the same minute
# and raced it; it was also SIGTERM'd by the 60s default timeout and circuit-broken since 2026-05-18.
# A Hermes cron job (tldr-scrape, f9e882b233e2) did the same and is paused. Concurrent runs caused
# the feed's duplicate ids and lost rows.
[[job]]
name = "tldr-scrape"
schedule = "0 9 * * 1-5"
type = "script"
command = "bun run ~/.claude/PAI/TOOLS/TLDRScraper.ts --today"
output = "log"
enabled = false

# Weekly latency drift check — runs analyze-latency.ts --dry-run every Monday 9am.
# Outputs proposal table to log; apply manually with --apply when drift is confirmed.
[[job]]
name = "latency-drift-check"
schedule = "0 9 * * 1"
type = "script"
command = "bun run ~/.claude/PAI/TOOLS/analyze-latency.ts --dry-run"
output = "log"
enabled = true

# Harvest runs post-triage. Enable once daily triage is consistent (runs before 8pm).
# Fetches full article content for kept items, extracts structured knowledge to MEMORY/KNOWLEDGE/TLDR/.
[[job]]
