# PAI Pulse — Unified Daemon Configuration
#
# Pulse is THE daemon for every PAI installation.
# One process handles: cron jobs, chat, observability, hooks, DA.
#
# type = "script" → runs command, $0 cost
# type = "claude" → spawns claude --print, costs tokens
# output = telegram | ntfy | email | log
# Sentinels: NO_ACTION, NO_URGENT, NO_EVENTS → suppress dispatch

# ── Module Configuration ──

[telegram]
enabled = false

[imessage]
enabled = false

[observability]
enabled = true
dashboard_dir = "Observability/out"

[performance]
enabled = true

[hooks]
enabled = true
blocked_skills = ["keybindings-help"]

[syslog]
enabled = true
port = 5514
# Captures UniFi syslog to ~/.claude/PAI/MEMORY/OBSERVABILITY/unifi-syslog.jsonl.
# See _NETWORK/Workflows/CaptureLogs.md for controller-side setup.

[da]
enabled = true
primary = "munro"
heartbeat_schedule = "*/30 * * * *"
heartbeat_model = "haiku"
heartbeat_cost_ceiling = 0.01
diary_schedule = "0 23 * * *"
growth_schedule = "0 4 * * 0"

[tldr]
enabled = true

[code-review]
enabled = true

# ── Cron Jobs ──
# NOTE: Email triage, calendar reminders, morning brief, schedule review,
# and intel brief are now Devi's responsibility (running on her Mac Mini).
# {{DA_NAME}}'s Pulse handles: healthcheck, memory consolidation, DA subsystem.

[[job]]
name = "cost-aggregation"
schedule = "*/15 * * * *"
type = "script"
command = "bun run Performance/cost-aggregator.ts"
output = "log"
enabled = true

# Nightly autopilot code review — Forgejo repos only (pai-config, dinenasty).
# Report-only: writes findings to MEMORY/STATE/code-review-queue.jsonl,
# never auto-applies fixes. Skips a repo if no commits in the last 24h.
# timeout_ms generous: worst case per repo is 120s your-inference-host pass + 300s Sonnet validation,
# times 2 repos = 840s, plus headroom for the 600s direct-Sonnet fallback if your-inference-host is down.
# your-inference-host is free/local so there's no cost pressure to keep this tight — 2026-07-08, after
# the 60s default (spawnScript's fallback, this job never set its own) silently SIGTERM'd
# every run for a week and tripped the 3-failure circuit breaker.
[[job]]
name = "nightly-code-review"
schedule = "23 4 * * *"
type = "script"
command = "bun run ../TOOLS/NightlyCodeReview.ts --repo ${HOME}/.claude --label pai-config && bun run ../TOOLS/NightlyCodeReview.ts --repo ${HOME}/code/dinenasty --label dinenasty"
output = "log"
enabled = true
timeout_ms = 1800000

# Weekly Flash regression canary — workload bench, 6 use cases x 10 cases x 1 rep (~60 jailed
# agy calls + ~60 Haiku judge calls). Sunday 03:00 so it stays clear of the weekday TLDR run
# that shares the AI Pro quota (a full 5-rep run is ~300 calls, near the ~266-call ceiling).
# Exit 1 + Pulse notify if any use case drops below USER/Evals/WorkloadBench/canary-floors.yaml.
# ISA: MEMORY/WORK/20260923-105803_workload-bench-gemini-38-flash (ISC-12, ISC-13).
[[job]]
name = "workload-bench-flash-canary"
schedule = "0 3 * * 0"
type = "script"
command = "bun run ../TOOLS/FreeTierEvals/workload_bench.ts --model agyflash38 --reps 1 --use-cases code-review-diff,isa-criteria-authoring,knowledge-note-synthesis,prompt-classify-mode-tier,threat-model-design,tldr-categorize --threshold-file ../USER/Evals/WorkloadBench/canary-floors.yaml"
output = "log"
enabled = true
timeout_ms = 3600000

# Weekly release-gate regression check. Runs the real release.ts --scan-only (never a push)
# against a hardlink copy of ~/.claude seeded with canaries; fails if a private-zone canary
# reaches the stage or a gate stops firing. ~150 s. --notify posts to /notify on failure,
# because Pulse only logs failed script jobs. Saturday 05:00: clear of the 02:00 auto-commit
# (git add -A would race the fixture), the 04:23 nightly review and the Sunday canary.
# ISA: MEMORY/WORK/20260928-073500_release-leak-regression-harness. ADR: release-secretscan-strict-and-leak-harness.md.
[[job]]
name = "release-leak-test"
schedule = "0 5 * * 6"
type = "script"
command = "bun run ../TOOLS/ReleaseLeakTest.ts --notify"
output = "log"
enabled = true
timeout_ms = 1800000

[[job]]
name = "healthcheck"
schedule = "*/5 * * * *"
type = "script"
command = "bun run checks/health.ts"
output = "ntfy"
enabled = true

[[job]]
name = "airgradient-poll"
schedule = "*/5 * * * *"
type = "script"
command = "bun run checks/airgradient-poll.ts"
output = "log"
enabled = true

# Anthropic cost observability — appends JSONL ledger every hour, voice-alerts
# on leak regressions (new API-billing call sites, API spend > $5/mo, sub >95%).
# Added 2026-04-22 after the April invoice incident ($498.45 Sonnet 4.5 +
# Web Search). Zero AI cost — pure static scan + OAuth cache read.
[[job]]
name = "cost-tracker"
schedule = "0 * * * *"
type = "script"
command = "bun run ~/.claude/PAI/TOOLS/CostTracker.ts log && bun run ~/.claude/PAI/TOOLS/CostTracker.ts alert-check"
output = "log"
enabled = true

[[job]]
name = "memory-consolidation"
schedule = "0 3 * * *"
type = "claude"
prompt = "Run learning consolidation: execute `bun run ~/.claude/PAI/TOOLS/SessionHarvester.ts --recent 20` then `bun run ~/.claude/PAI/TOOLS/LearningPatternSynthesis.ts --week`. Summarize what was learned and any patterns found."
model = "sonnet"
output = "log"
enabled = true

